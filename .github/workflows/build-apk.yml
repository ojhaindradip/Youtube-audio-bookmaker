name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Project Assets
        run: |
          mkdir -p www
          cp index.html www/
          echo '{"name": "youtube-audio-bookmaker", "version": "1.0.0", "dependencies": {"@capacitor/core": "^6.0.0"}, "devDependencies": {"@capacitor/cli": "^6.0.0", "@capacitor/android": "^6.0.0"}}' > package.json
          npm install

      - name: Initialize Capacitor Android App
        run: |
          npx cap init "Youtube Audio Bookmaker" "com.youtubeaudio.bookmaker" --web-dir=www
          npx cap add android

      - name: Compile Application Package
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Export Completed APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioBookmaker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
